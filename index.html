<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon_hd.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hekeya</title>

    <!-- local font: starts downloading immediately -->
    <link rel="preload" href="/fonts/ModernNegra.woff2" as="font" type="font/woff2" crossorigin />

    <!-- the first thing visible in the hero: download it with top priority -->
    <link rel="preload" href="/images-webp/yarn-ball.webp" as="image" fetchpriority="high" />

    <!-- Supabase: open the connection early. Replace YOUR-PROJECT with your project id (the part before .supabase.co), then remove the comment marks -->
    <!-- <link rel="preconnect" href="https://YOUR-PROJECT.supabase.co" crossorigin /> -->

    <!-- ALL Google Fonts in one request (the @import in index.css is gone: it made the browser wait twice) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Allura&family=DM+Serif+Text:ital@0;1&family=Mona+Sans:wght@400..700&display=swap"
            rel="stylesheet"
    />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
